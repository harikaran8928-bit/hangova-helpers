[[headers]]
  for = "/*"
  [headers.values]
    # Clickjacking Protection
    X-Frame-Options = "DENY"
    
    # MIME-sniffing Protection
    X-Content-Type-Options = "nosniff"
    
    # Enables browser XSS filter
    X-XSS-Protection = "1; mode=block"
    
    # Controls referrer information
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Content Security Policy
    Content-Security-Policy = "default-src 'self' https:; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:;"
    
    # Restricts browser features
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"